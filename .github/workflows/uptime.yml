name: Uptime check

# Watches the live site from outside the server. The monitor in scripts/monitor runs ON the server,
# so it cannot report the server itself being down; this one can. There is no alert channel that
# survives the server being down except GitHub: when this job fails, GitHub emails the repo owner
# ("Settings -> Notifications -> Actions" must have failed-workflow emails on, which is the default).

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Homepage and products API answer
        env:
          SITE_URL: ${{ secrets.SITE_URL || 'https://balapasa.com.np' }}
        run: |
          check() {
            # One retry after 45 s, so a restart during a deploy is not reported as an outage.
            for attempt in 1 2; do
              code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 30 "$1" || echo 000)
              if [ "$code" = "200" ] && grep -q "$2" /tmp/body; then echo "ok  $1"; return 0; fi
              echo "attempt $attempt: $1 answered $code"
              [ "$attempt" = 1 ] && sleep 45
            done
            return 1
          }
          check "$SITE_URL/" "</html>"
          check "$SITE_URL/api/products?limit=1" '"products"'
